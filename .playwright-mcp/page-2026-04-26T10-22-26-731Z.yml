        - text: 制造商
      - paragraph [ref=e17]: PINTE品特位于中国东莞，是领先的烫金箔生产厂家。专业生产金属烫金箔、颜料烫金箔、镭射全息烫金箔、冷烫箔和特种烫金箔，广泛应用于包装、化妆品、皮革、塑胶、纺织品等行业。浏览我们全系列烫金箔颜色产品。
